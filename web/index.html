<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rameur</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<nav aria-label="Vues">
  <button type="button" data-vue="direct" aria-current="page">Séance</button>
  <button type="button" data-vue="historique">Historique</button>
</nav>

<main id="vue-direct" class="vue">
  <header>
    <p id="etat" role="status">Non connecté</p>
    <p id="secondaire"></p>
  </header>

  <section class="principaux" aria-label="Mesures principales">
    <div><span class="valeur" id="allure">–:––</span><span class="unite">/500 m</span></div>
    <div><span class="valeur" id="cadence">–</span><span class="unite">coups/min</span></div>
    <div><span class="valeur" id="temps">0:00</span><span class="unite">temps</span></div>
    <div><span class="valeur" id="distance">0</span><span class="unite">mètres</span></div>
  </section>

  <section class="secondaires" aria-label="Autres mesures">
    <div><span id="puissance">–</span> W</div>
    <div><span id="calories">0</span> kcal</div>
    <div><span id="coups">0</span> coups</div>
    <div>niveau <span id="resistance">–</span></div>
    <div hidden id="bloc-fc"><span id="fc">–</span> bpm</div>
  </section>

  <button id="action" class="principal" type="button">Se connecter au rameur</button>
  <p id="aide"></p>
</main>

<main id="vue-resume" class="vue page" hidden>
  <h1 id="resume-titre">Séance</h1>
  <p id="resume-date" class="discret"></p>
  <dl id="resume-chiffres" class="chiffres"></dl>
  <h2>Temps de passage</h2>
  <table id="resume-passages">
    <thead><tr><th scope="col">Distance</th><th scope="col">Temps</th><th scope="col">Tronçon de 500 m</th></tr></thead>
    <tbody></tbody>
  </table>
  <p id="resume-sans-passage" class="discret" hidden>Moins de 500 m : pas de temps de passage.</p>
  <div class="boutons">
    <button type="button" id="resume-json">Exporter en JSON</button>
    <button type="button" id="resume-csv">Exporter en CSV</button>
    <button type="button" id="resume-supprimer" class="danger">Supprimer</button>
  </div>
  <button type="button" id="resume-retour" class="principal">Retour</button>
</main>

<main id="vue-historique" class="vue page" hidden>
  <h1>Historique</h1>
  <p id="historique-vide" class="discret" hidden>Aucune séance pour l’instant. Elles s’enregistrent toutes seules dès que vous ramez.</p>
  <ul id="historique-liste" class="liste"></ul>
  <div class="boutons">
    <button type="button" id="historique-json">Tout exporter en JSON</button>
    <button type="button" id="historique-csv">Tout exporter en CSV</button>
    <label class="bouton">Importer un JSON<input type="file" id="historique-import" accept="application/json,.json" hidden></label>
  </div>
  <p id="historique-message" class="discret" role="status"></p>
</main>

<script type="module" src="/web/app.js"></script>
</body>
</html>
